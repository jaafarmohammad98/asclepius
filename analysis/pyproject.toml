[project]
name = "asclepius"
version = "0.1.0"
description = "Analysis engine: loads extractor and r/PSSD harvester datasets for group statistics"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asclepius"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format sets line length

[tool.mypy]
packages = ["asclepius"]
ignore_missing_imports = true
