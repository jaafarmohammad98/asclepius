[project]
name = "asclepius-hypothesis"
version = "0.1.0"
description = "Hypothesis engine: a local library of papers it may cite, built from PubMed"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "pypdf>=7.1.1",
]

[project.scripts]
asclepius-library = "hypothesis_engine.build:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypothesis_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format sets line length

[tool.mypy]
packages = ["hypothesis_engine"]
ignore_missing_imports = true
