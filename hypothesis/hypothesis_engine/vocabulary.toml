# The curated vocabulary the knowledge graph's nodes come from (spec G1, G2, G5).
#
# Each [[term]] is a node: `name` (an HGNC gene symbol, or the usual name), `kind` (gene,
# hormone, neurosteroid, receptor, symptom, syndrome), `aliases` (other names that count as
# it) and `pmid`, a paper of the library in which the term is found. A term whose paper is not
# in the library, or does not name it, is left out of the graph (`seed_problems`).
#
# Names with a capital letter or a digit match case-sensitively; lower-case names match with
# case aside (vocabulary.py). The syndromes are named in full: "PSSD" also names a nerve-testing
# device, "PFS" progression-free survival and "PAS" periodic acid-Schiff staining.
#
# Source: gene symbols from HGNC (genenames.org) in steroid, neurotransmitter, inflammation,
# neuropathy, epigenetic, retinoid and metabolic biology, hormones, neurosteroids, receptors
# and the symptoms reported in PSSD, PFS and PAS, chosen by hand (Nov 2026). Only the terms found
# in some paper of the built library were kept, each with the first such paper as its PMID.
#
# `ambiguous` names are also ordinary words or abbreviations ("CAT", "REST", "STAR" a trial,
# "ER" the emergency room, "GLA" gamma-linolenic acid): one counts only with a gene word
# ("gene", "receptor", "expression", "polymorphism"...) within three words. Left out, as the
# gene word is often near their other meaning in this literature: GC (granule cells, genomic
# control), ARC (the arcuate nucleus), NTS (the nucleus of the solitary tract), SET (the SET
# domain), C3 (carbon 3 of a steroid). MAX and IMPACT are found in no paper of the library.
ambiguous = [
  "ACE",
  "AR",
  "CAT",
  "CBP",
  "ER",
  "FOS",
  "GAL",
  "GLA",
  "INS",
  "KL",
  "NR1",
  "POR",
  "RAR",
  "REST",
  "RXR",
  "STAR",
  "STS",
  "TH",
  "VIP",
]

