# The researcher's install: one wheel with the analysis app, the hypothesis engine and the
# extractor's built page. Not built from here: `package/build.py` copies the code beside this
# file and fills in `dependencies` with the versions in analysis/uv.lock.

[project]
name = "asclepius"
version = "0.1.0"
description = "Research tool for PSSD and related post-drug syndromes: extractor page, analysis and hypotheses"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.15"  # onnxruntime (the embedding model) has no build for newer ones yet
dependencies = []  # filled in by build.py

[project.scripts]
asclepius = "asclepius.web.server:main"
asclepius-app = "asclepius.web.server:main"
asclepius-library = "hypothesis_engine.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asclepius", "hypothesis_engine"]
